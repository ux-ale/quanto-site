<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0C0F11;
    --sem-5:  rgba(255,255,255,0.05);
    --sem-8:  rgba(255,255,255,0.08);
    --sem-15: rgba(255,255,255,0.15);
    --border: rgba(255,255,255,0.08);
    --brand:  #0cbba1;
    --warn:   #f0920e;
    --danger: #ff6b5e;
    --text-1: #ffffff;
    --text-2: rgba(255,255,255,0.55);
    --text-3: rgba(255,255,255,0.30);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  html, body { margin: 0; min-height: 100%; background: #0C0F11; overscroll-behavior: none; }
  html { scroll-behavior: smooth; }

  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg, #283339 0%, #0C0F11 100%);
    pointer-events: none;
  }

  body {
    font-family: 'Sora', sans-serif;
    background: transparent;
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    min-height: 100vh;
  }

  .wrap { max-width: 940px; margin: 0 auto; padding: 0 28px 72px; }

  /* ─── HERO ─── */
  .hero { padding: 56px 0 26px; }

  .hero-icon {
    width: 52px; height: 52px; border-radius: 13px; overflow: hidden;
    margin: 0 0 20px; box-shadow: 0 16px 48px rgba(0,0,0,0.4);
  }
  .hero-icon img { width: 100%; height: 100%; display: block; }

  .hero h1 {
    font-size: clamp(30px, 5.5vw, 42px); font-weight: 700;
    line-height: 1.05; letter-spacing: -0.03em;
  }
  .hero h1 .teal { color: var(--brand); }

  /* ─── LOCALE CHIPS ─── */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 44px; }

  .chips button {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 8px 15px; border-radius: 100px;
    background: var(--sem-5); border: 1px solid var(--border);
    color: var(--text-2); font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 400;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .chips button .flag { font-size: 14px; line-height: 1; }
  .chips button:hover { color: var(--text-1); border-color: var(--sem-15); }
  .chips button.active {
    background: rgba(12,187,161,0.14); border-color: var(--brand);
    color: var(--text-1); font-weight: 600;
  }

  /* ─── SCREENSHOT STRIP ─── */
  .shots {
    display: flex; gap: 12px; overflow-x: auto;
    margin-bottom: 34px; padding-bottom: 10px;
    scroll-snap-type: x proximity;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent;
    -webkit-overflow-scrolling: touch;
  }
  .shots::-webkit-scrollbar { height: 6px; }
  .shots::-webkit-scrollbar-track { background: transparent; }
  .shots::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 100px; }
  .shots:hover::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.20); }

  .shots img {
    display: block; flex-shrink: 0; height: 340px; width: auto;
    border-radius: 16px; border: 1px solid var(--border);
    background: var(--sem-5); scroll-snap-align: start;
  }
  .shots.ios  img { aspect-ratio: 258 / 560; }
  .shots.play img { aspect-ratio: 315 / 560; }

  /* ─── LOCALE HEADER ─── */
  .locale-head {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  .locale-head h2 { font-size: 30px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; }

  .status {
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    padding: 5px 13px; border-radius: 100px; white-space: nowrap;
  }
  .status { display: inline-flex; align-items: center; gap: 7px; }
  .status::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .status.final {
    background: rgba(12,187,161,0.12); border: 1px solid rgba(12,187,161,0.35); color: var(--brand);
  }
  .status.final::before { background: var(--brand); }

  /* rebuilt from Search Ads data, but not submitted yet */
  .status.data {
    background: var(--sem-5); border: 1px solid var(--border); color: var(--text-2);
  }
  .status.data::before { background: var(--brand); }

  .status.draft {
    background: rgba(240,146,14,0.12); border: 1px solid rgba(240,146,14,0.35); color: var(--warn);
  }
  .status.draft::before { background: var(--warn); }

  .seg {
    display: inline-flex; gap: 2px; padding: 4px; margin-bottom: 22px;
    border-radius: 64px; background: var(--sem-8);
  }
  .seg button {
    position: relative;
    padding: 9px 22px; border-radius: 100px; cursor: pointer;
    border: 0.5px solid transparent; background: none;
    font-family: 'Sora', sans-serif; font-size: 13.5px; font-weight: 400; color: var(--text-3);
    transition: background 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .seg button:hover { color: var(--text-2); }
  .seg button.on {
    background: radial-gradient(100% 100% at 50% 0%, rgba(255, 255, 255, 0.20) 0%, rgba(255, 255, 255, 0.08) 100%);
    color: var(--text-1);
  }

  /* 0.5px stroke that fades from white at the top to nothing at the
     bottom - a masked gradient ring, since a border can't be a gradient */
  .seg button.on::after {
    content: ""; position: absolute; inset: -0.5px; border-radius: inherit;
    padding: 0.5px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.50) 0%, rgba(255, 255, 255, 0) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
  }

  /* ─── SECTION ─── */
  /* ─── FIELD ─── */
  .field {
    border: 1px solid var(--border); border-left: 2px solid transparent;
    border-radius: 12px; background: rgba(255,255,255,0.03);
    margin-bottom: 12px; overflow: hidden;
    transition: border-color 0.2s;
  }
  .field.is-copied { border-left-color: var(--brand); }

  .field-head { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }

  .field-label { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .field-hint {
    font-size: 12.5px; font-weight: 300; color: var(--text-3);
    margin-right: auto; line-height: 1.4;
  }

  .meter { width: 96px; height: 4px; border-radius: 100px; background: rgba(255,255,255,0.10); flex-shrink: 0; }
  .meter span { display: block; height: 100%; border-radius: 100px; background: var(--brand); }
  .meter.over span { background: var(--danger); }

  .count {
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--text-2); white-space: nowrap; flex-shrink: 0;
  }
  .count.over { color: var(--danger); }

  /* small build of the site's raised pill: face on a ledge that
     collapses on press */
  .copy-btn {
    flex-shrink: 0; cursor: pointer; padding: 7px 18px; border-radius: 100px;
    margin-bottom: 3px; /* offsets the ledge so the face sits centred in the row */
    background: rgba(255,255,255,0.0975);
    border: 1px solid var(--border); color: var(--text-1);
    font-family: 'Sora', sans-serif; font-size: 12.5px; font-weight: 400; line-height: 20px;
    box-shadow: 0 3px 0 var(--sem-5);
    transition: transform 0.1s ease, box-shadow 0.1s ease, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .copy-btn:hover { border-color: var(--sem-15); }
  .copy-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--sem-5); }

  .field-body {
    border-top: 1px solid var(--border); background: rgba(0,0,0,0.20);
    padding: 16px 18px;
    font-family: var(--mono); font-size: 13px; line-height: 1.7;
    color: var(--text-1); white-space: pre-wrap; word-break: break-word;
  }
  .field-body.kw { color: var(--brand); }

  .field-body.clamped {
    max-height: 200px; overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, #000 130px, transparent 100%);
            mask-image: linear-gradient(180deg, #000 130px, transparent 100%);
  }

  .expand {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: rgba(0,0,0,0.20); border: none; border-top: 1px solid var(--border);
    padding: 10px 18px; font-family: 'Sora', sans-serif; font-size: 12px;
    font-weight: 400; color: var(--text-3);
  }
  .expand:hover { color: var(--text-2); }

  /* ─── FOOTER ─── */
  footer {
    margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    font-size: 11px; font-weight: 300; color: var(--text-3);
  }
  .linkbtn {
    margin-left: auto; background: none; border: none; padding: 0; cursor: pointer;
    font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 400; color: var(--text-3);
    text-decoration: underline; text-underline-offset: 3px;
  }
  .linkbtn:hover { color: var(--text-2); }

  /* ─── TOAST ─── */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--brand); color: #07211d;
    font-size: 13px; font-weight: 600; padding: 11px 20px; border-radius: 100px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    opacity: 0; pointer-events: none;
    transition: opacity 0.22s, transform 0.22s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    .wrap { padding: 0 18px 56px; }
    .hero { padding: 40px 0 20px; }
    .chips { margin-bottom: 32px; }
    .field-head { flex-wrap: wrap; gap: 10px 12px; padding: 14px 15px; }
    .field-label { width: 100%; }
    .field-hint { width: 100%; margin-right: 0; order: 3; }
    .meter { order: 1; }
    .count { order: 1; margin-right: auto; }
    .copy-btn { order: 2; }
    .field-body { padding: 14px 15px; }
    .shots { gap: 10px; margin-bottom: 26px; }
    .shots img { height: 260px; border-radius: 14px; }
    .locale-head { gap: 12px; }
    .seg { width: 100%; }
    .seg button { flex: 1; padding: 9px 12px; }
  }
</style>
</head>

<script>

,"store":"play","indexed":true,"needsNewVersion":false,"hint":"Indexed. Shown under the title"},{"key":"play_full","label":"Full description","limit":4000,"store":"play","indexed":true,"needsNewVersion":false,"hint":"Indexed on Google Play, unlike the App Store"}],"locales":[{"code":"EN","language":"English","appStoreLocale":"English (U.S.) + (U.K.)","note":"Live","status":"final","values":{"ios_name":"Quanto: Budget Expense Tracker","ios_sub":"Money Manager, Finance Planner","kw_us":"spending,app,personal,receipt,scanner,recurring,bill,daily,monthly,travel,currency,income,weekly","kw_gb":"expenses,budgeting,spend,income,saving,receipts,statement,weekly,yearly,wallet,offline,net,worth","promo":"Scan a receipt, import a bank statement PDF, or speak an expense. Our AI fills in the details. For maximum privacy and security, Quanto does not connect to your bank.","ios_desc":"Quanto is an expense tracker with AI entry. Scan a receipt, import a PDF bank statement, speak an expense, or type it. For maximum privacy and security, Quanto does not connect to your bank.\n\nADDING AN EXPENSE\n• Scan a receipt. Our AI reads the merchant and the amount, and assigns the best category automatically\n• Add a screenshot of your transactions from your bank, a payment page or a transfer receipt. Our AI reads it the same way\n• Import a PDF bank statement. Our AI extracts every transaction in one pass\n• Speak it. Voice entry accepts several expenses in one sentence, and continues working after you leave the app\n• Or add it yourself in a couple of taps\n• Paid in another currency? Add it as it is and Quanto converts it for you\n\nWHERE YOUR MONEY GOES\n• Review your transactions by day, week, month, quarter, year or any custom date range\n• Spending by category, with a drill-down on each category\n• Compare your income vs expenses in Analytics\n• How much is left this month, as an amount and as a percentage\n• A calendar showing each day's net position\n• Filter and sort by account, category, type, amount or date\n\nBUDGETS\n• Weekly or monthly budgets\n• Several budgets running at once\n• Per-category limits\n• Remaining budget for the current period\n\nSUBSCRIPTIONS AND RECURRING EXPENSES\nEach repeating payment shows its monthly and annual cost, the account it charges, its billing cycle, the next renewal date, and everything paid to date.\n\nACCOUNTS\nTrack cash, cards and accounts separately. Quanto shows a total net worth across all of them.\n\nENTRY POINTS\n• Home Screen widget\n• Control Center actions\n• Siri Shortcuts\n• Apple Pay automation\n\nPRIVACY AND DATA\n• Transactions are stored on your device, not on our servers\n• No account is required\n• Face ID lock, and a one-tap balance blur\n• Backup to iCloud, Google Drive or local storage\n• CSV export and CSV import\n• Receipts and statements you choose to scan are sent to a third-party AI service to read the text\n\nPREMIUM\nRecurring transactions, multiple accounts, widgets, Control Center actions, Apple Pay automation, backup and export. Available monthly, yearly, or as a one-time lifetime purchase.\n\nQuanto works offline, requires no account, and does not connect to your bank.","iap_group":"Quanto Premium","iap_m":"Premium Monthly: Widgets","iap_y":"Premium Yearly: Backup, CSV","iap_l":"Premium Lifetime: Accounts","play_title":"Quanto: Budget Expense Tracker","play_short":"Money manager & budget planner: track spending, scan receipts, plan monthly.","play_full":"Quanto is an expense tracker, budget planner and money manager with AI entry. Scan a receipt, import a PDF bank statement, speak an expense, or type it. For maximum privacy and security, Quanto does not connect to your bank.\n\nADDING AN EXPENSE\n• Scan a receipt. Our AI reads the merchant and the amount, and assigns the best category automatically\n• Add a screenshot of your transactions from your bank, a payment page or a transfer receipt. Our AI reads it the same way\n• Import a PDF bank statement. Our AI extracts every transaction in one pass\n• Speak it. Voice entry accepts several expenses in one sentence, and continues working after you leave the app\n• Or add it yourself in a couple of taps\n• Paid in another currency? Add it as it is and Quanto converts it for you, which also makes Quanto a travel expense tracker\n\nTRACKING YOUR SPENDING\n• Review your transactions by day, week, month, quarter, year or any custom date range\n• Spending by category, with a drill-down on each category\n• Compare your income vs expenses in Analytics\n• How much budget is left this month, as an amount and as a percentage\n• A calendar showing each day's net position\n• Filter and sort by account, category, type, amount or date\n\nBUDGETS AND BUDGET LIMITS\n• Weekly or monthly budgets\n• Several budgets running at once\n• Per-category budget limits\n• Remaining budget for the current period\n\nSUBSCRIPTIONS AND RECURRING EXPENSES\nEach repeating payment shows its monthly and annual cost, the account it charges, its billing cycle, the next renewal date, and everything paid to date.\n\nACCOUNTS AND NET WORTH\nTrack cash, cards and accounts separately. Quanto shows a total net worth across all of them.\n\nWIDGETS AND SHORTCUTS\n• Add expenses from the home screen widget\n• Reminders, custom categories, month start day and first day of week\n\nPRIVACY AND DATA\n• Transactions are stored on your device, not on our servers\n• No account is required\n• Biometric lock, and a one-tap balance blur\n• Backup to Google Drive or local storage\n• CSV export and CSV import\n• Receipts and statements you choose to scan are sent to a third-party AI service to read the text\n\nQUANTO PREMIUM\nRecurring transactions, multiple accounts, widgets, backup and export. Available monthly, yearly, or as a one-time lifetime purchase.\n\nQuanto works offline, requires no account, and does not connect to your bank. An AI expense tracker, a budget planner and a money manager in one app."},"flag":"🇬🇧","chip":"English"},{"code":"DE","language":"German","appStoreLocale":"German","note":"High revenue per install","status":"data-backed","values":{"ios_name":"Quanto: Budget Expense Tracker","ios_sub":"Money Manager, Finance Planner","kw_us":"ausgaben,finanzen,sparen,konto,beleg,abo,monatlich,geld,kassenbuch,haushalt,app,gratis","promo":"Beleg scannen, Kontoauszug importieren oder Ausgabe einsprechen – die KI trägt die Details ein. Quanto verbindet sich für maximale Privatsphäre nicht mit deiner Bank.","ios_desc":"Quanto ist ein Ausgaben-Tracker mit KI-Erfassung. Scanne einen Beleg, importiere einen PDF-Kontoauszug, sprich eine Ausgabe ein oder tippe sie ein. Für maximale Privatsphäre und Sicherheit verbindet sich Quanto nicht mit deiner Bank.\n\nAUSGABE HINZUFÜGEN\n• Scanne einen Beleg. Unsere KI liest Händler und Betrag und ordnet automatisch die passende Kategorie zu\n• Füge einen Screenshot deiner Umsätze aus dem Banking, von einer Zahlungsseite oder einer Überweisungsbestätigung hinzu. Unsere KI liest ihn genauso aus\n• Importiere einen PDF-Kontoauszug. Unsere KI erfasst alle Umsätze in einem Durchgang\n• Sprich sie ein. Die Spracheingabe nimmt mehrere Ausgaben in einem Satz auf und arbeitet weiter, nachdem du die App verlassen hast\n• Oder trage sie selbst mit wenigen Tipps ein\n• In einer anderen Währung bezahlt? Trage sie so ein, wie sie ist, und Quanto rechnet sie für dich um\n\nWOHIN DEIN GELD GEHT\n• Sieh dir deine Umsätze nach Tag, Woche, Monat, Quartal, Jahr oder einem beliebigen Zeitraum an\n• Ausgaben nach Kategorie, mit Detailansicht je Kategorie\n• Vergleiche Einnahmen und Ausgaben in der Auswertung\n• Wie viel diesen Monat übrig ist, als Betrag und als Prozentwert\n• Ein Kalender mit dem Saldo jedes Tages\n• Filtere und sortiere nach Konto, Kategorie, Art, Betrag oder Datum\n\nBUDGETS\n• Wöchentliche oder monatliche Budgets\n• Mehrere Budgets gleichzeitig\n• Limits pro Kategorie\n• Restbudget für den laufenden Zeitraum\n\nABOS UND WIEDERKEHRENDE AUSGABEN\nJede wiederkehrende Zahlung zeigt ihre monatlichen und jährlichen Kosten, das belastete Konto, den Abrechnungszyklus, das nächste Verlängerungsdatum und alles, was bisher gezahlt wurde.\n\nKONTEN\nVerwalte Bargeld, Karten und Konten getrennt. Quanto zeigt das Gesamtvermögen über alle hinweg.\n\nSCHNELLZUGRIFFE\n• Widget für den Home-Bildschirm\n• Aktionen im Kontrollzentrum\n• Siri-Kurzbefehle\n• Apple Pay Automation\n\nDATENSCHUTZ UND DATEN\n• Umsätze werden auf deinem Gerät gespeichert, nicht auf unseren Servern\n• Es ist kein Account nötig\n• Face ID-Sperre und Unkenntlichmachen des Saldos mit einem Tipp\n• Backup in iCloud, Google Drive oder lokal\n• CSV-Export und CSV-Import\n• Belege und Kontoauszüge, die du scannst, werden an einen KI-Dienst eines Drittanbieters gesendet, um den Text auszulesen\n\nPREMIUM\nWiederkehrende Buchungen, mehrere Konten, Widgets, Aktionen im Kontrollzentrum, Apple Pay Automation, Backup und Export. Verfügbar monatlich, jährlich oder als einmaliger Lifetime-Kauf.\n\nQuanto funktioniert offline, benötigt keinen Account und verbindet sich nicht mit deiner Bank.","iap_group":"Quanto Premium","iap_m":"Premium Monat: Widgets","iap_y":"Premium Jahr: Backup, CSV","iap_l":"Premium Lifetime: Konten","play_title":"Quanto: Budget Expense Tracker","play_short":"Haushaltsbuch, Ausgaben und Belege. Expense tracker & money manager.","play_full":"Quanto ist ein Ausgaben-Tracker, Budgetplaner und Finanzmanager mit KI-Erfassung. Scanne einen Beleg, importiere einen PDF-Kontoauszug, sprich eine Ausgabe ein oder tippe sie ein. Für maximale Privatsphäre und Sicherheit verbindet sich Quanto nicht mit deiner Bank.\n\nAUSGABE HINZUFÜGEN\n• Scanne einen Beleg. Unsere KI liest Händler und Betrag und ordnet automatisch die passende Kategorie zu\n• Füge einen Screenshot deiner Umsätze aus dem Banking, von einer Zahlungsseite oder einer Überweisungsbestätigung hinzu. Unsere KI liest ihn genauso aus\n• Importiere einen PDF-Kontoauszug. Unsere KI erfasst alle Umsätze in einem Durchgang\n• Sprich sie ein. Die Spracheingabe nimmt mehrere Ausgaben in einem Satz auf und arbeitet weiter, nachdem du die App verlassen hast\n• Oder trage sie selbst mit wenigen Tipps ein\n• In einer anderen Währung bezahlt? Trage sie so ein, wie sie ist, und Quanto rechnet sie für dich um – damit ist Quanto auch ein Ausgaben-Tracker für Reisen\n\nDEINE AUSGABEN IM BLICK\n• Sieh dir deine Umsätze nach Tag, Woche, Monat, Quartal, Jahr oder einem beliebigen Zeitraum an\n• Ausgaben nach Kategorie, mit Detailansicht je Kategorie\n• Vergleiche Einnahmen und Ausgaben in der Auswertung\n• Wie viel Budget diesen Monat übrig ist, als Betrag und als Prozentwert\n• Ein Kalender mit dem Saldo jedes Tages\n• Filtere und sortiere nach Konto, Kategorie, Art, Betrag oder Datum\n\nBUDGETS UND BUDGET-LIMITS\n• Wöchentliche oder monatliche Budgets\n• Mehrere Budgets gleichzeitig\n• Budget-Limits pro Kategorie\n• Restbudget für den laufenden Zeitraum\n\nABOS UND WIEDERKEHRENDE AUSGABEN\nJede wiederkehrende Zahlung zeigt ihre monatlichen und jährlichen Kosten, das belastete Konto, den Abrechnungszyklus, das nächste Verlängerungsdatum und alles, was bisher gezahlt wurde.\n\nKONTEN UND GESAMTVERMÖGEN\nVerwalte Bargeld, Karten und Konten getrennt. Quanto zeigt das Gesamtvermögen über alle hinweg.\n\nWIDGETS UND KURZBEFEHLE\n• Ausgaben über das Widget auf dem Startbildschirm hinzufügen\n• Erinnerungen, eigene Kategorien, Monatsbeginn und erster Tag der Woche\n\nDATENSCHUTZ UND DATEN\n• Umsätze werden auf deinem Gerät gespeichert, nicht auf unseren Servern\n• Es ist kein Account nötig\n• Biometrische Sperre und Unkenntlichmachen des Saldos mit einem Tipp\n• Backup auf Google Drive oder lokal\n• CSV-Export und CSV-Import\n• Belege und Kontoauszüge, die du scannst, werden an einen KI-Dienst eines Drittanbieters gesendet, um den Text auszulesen\n\nQUANTO PREMIUM\nWiederkehrende Buchungen, mehrere Konten, Widgets, Backup und Export. Verfügbar monatlich, jährlich oder als einmaliger Lifetime-Kauf.\n\nQuanto funktioniert offline, benötigt keinen Account und verbindet sich nicht mit deiner Bank. Ein KI-Ausgaben-Tracker, ein Budgetplaner und ein Haushaltsbuch in einer App. Ein expense tracker und money manager: Ausgaben, Budget und Finanzen in einer App."},"flag":"🇩🇪","chip":"German"},{"code":"FR","language":"French","appStoreLocale":"French","note":"High revenue per install","status":"data-backed","values":{"ios_name":"Quanto: Budget Expense Tracker","ios_sub":"Money Manager, Finance Planner","kw_us":"dépenses,suivi,frais,compte,facture,abonnement,revenus,épargne,reçu,mensuel,app,gratuit","promo":"Scannez un ticket, importez un relevé PDF ou dictez une dépense : l'IA remplit les détails. Pour une confidentialité maximale, Quanto ne se connecte pas à votre banque.","ios_desc":"Quanto est une app de suivi des dépenses avec saisie par IA. Scannez un ticket de caisse, importez un relevé bancaire PDF, dictez une dépense ou saisissez-la. Pour une confidentialité et une sécurité maximales, Quanto ne se connecte pas à votre banque.\n\nAJOUTER UNE DÉPENSE\n• Scannez un ticket. Notre IA lit le commerçant et le montant, et attribue automatiquement la meilleure catégorie\n• Ajoutez une capture d'écran de vos transactions bancaires, d'une page de paiement ou d'un reçu de virement. Notre IA la lit de la même façon\n• Importez un relevé bancaire PDF. Notre IA en extrait chaque transaction en une seule fois\n• Dictez-la. La saisie vocale accepte plusieurs dépenses dans une même phrase et continue de fonctionner après que vous avez quitté l'app\n• Ou ajoutez-la vous-même en deux ou trois touchers\n• Payé dans une autre devise ? Ajoutez le montant tel quel, Quanto le convertit pour vous\n\nOÙ PASSE VOTRE ARGENT\n• Consultez vos transactions par jour, semaine, mois, trimestre, année ou sur une période personnalisée\n• Dépenses par catégorie, avec le détail de chaque catégorie\n• Comparez vos revenus et vos dépenses dans Analyses\n• Ce qu'il vous reste ce mois-ci, en montant et en pourcentage\n• Un calendrier indiquant votre solde net jour par jour\n• Filtrez et triez par compte, catégorie, type, montant ou date\n\nBUDGETS\n• Budgets hebdomadaires ou mensuels\n• Plusieurs budgets en cours en même temps\n• Limites par catégorie\n• Budget restant pour la période en cours\n\nABONNEMENTS ET DÉPENSES RÉCURRENTES\nChaque paiement récurrent affiche son coût mensuel et annuel, le compte débité, sa fréquence de facturation, la date du prochain renouvellement et le total payé à ce jour.\n\nCOMPTES\nSuivez espèces, cartes et comptes séparément. Quanto affiche un patrimoine net total pour l'ensemble.\n\nPOINTS D'ACCÈS\n• Widget sur l'écran d'accueil\n• Actions dans le centre de contrôle\n• Raccourcis Siri\n• Automatisation Apple Pay\n\nCONFIDENTIALITÉ ET DONNÉES\n• Les transactions sont stockées sur votre appareil, pas sur nos serveurs\n• Aucun compte n'est requis\n• Verrouillage par Face ID et floutage du solde d'un simple toucher\n• Sauvegarde sur iCloud, Google Drive ou stockage local\n• Export CSV et import CSV\n• Les tickets et relevés que vous choisissez de scanner sont envoyés à un service d'IA tiers pour en lire le texte\n\nPREMIUM\nTransactions récurrentes, comptes multiples, widgets, actions du centre de contrôle, automatisation Apple Pay, sauvegarde et export. Disponible en formule mensuelle, annuelle ou en achat unique à vie.\n\nQuanto fonctionne hors ligne, ne demande aucun compte et ne se connecte pas à votre banque.","iap_group":"Quanto Premium","iap_m":"Premium mensuel : widgets","iap_y":"Premium annuel : sauvegarde","iap_l":"Premium à vie : comptes","play_title":"Quanto: Budget Expense Tracker","play_short":"Suivi des dépenses, budget et reçus. Expense tracker & money manager.","play_full":"Quanto est une app de suivi des dépenses, de budget et de gestion d'argent avec saisie par IA. Scannez un ticket de caisse, importez un relevé bancaire PDF, dictez une dépense ou saisissez-la. Pour une confidentialité et une sécurité maximales, Quanto ne se connecte pas à votre banque.\n\nAJOUTER UNE DÉPENSE\n• Scannez un ticket. Notre IA lit le commerçant et le montant, et attribue automatiquement la meilleure catégorie\n• Ajoutez une capture d'écran de vos transactions bancaires, d'une page de paiement ou d'un reçu de virement. Notre IA la lit de la même façon\n• Importez un relevé bancaire PDF. Notre IA en extrait chaque transaction en une seule fois\n• Dictez-la. La saisie vocale accepte plusieurs dépenses dans une même phrase et continue de fonctionner après que vous avez quitté l'app\n• Ou ajoutez-la vous-même en deux ou trois touchers\n• Payé dans une autre devise ? Ajoutez le montant tel quel, Quanto le convertit pour vous, ce qui en fait aussi un suivi des dépenses de voyage\n\nSUIVI DE VOS DÉPENSES\n• Consultez vos transactions par jour, semaine, mois, trimestre, année ou sur une période personnalisée\n• Dépenses par catégorie, avec le détail de chaque catégorie\n• Comparez vos revenus et vos dépenses dans Analyses\n• Le budget restant ce mois-ci, en montant et en pourcentage\n• Un calendrier indiquant votre solde net jour par jour\n• Filtrez et triez par compte, catégorie, type, montant ou date\n\nBUDGETS ET LIMITES DE BUDGET\n• Budgets hebdomadaires ou mensuels\n• Plusieurs budgets en cours en même temps\n• Limites de budget par catégorie\n• Budget restant pour la période en cours\n\nABONNEMENTS ET DÉPENSES RÉCURRENTES\nChaque paiement récurrent affiche son coût mensuel et annuel, le compte débité, sa fréquence de facturation, la date du prochain renouvellement et le total payé à ce jour.\n\nCOMPTES ET PATRIMOINE NET\nSuivez espèces, cartes et comptes séparément. Quanto affiche un patrimoine net total pour l'ensemble.\n\nWIDGETS ET RACCOURCIS\n• Ajoutez des dépenses depuis le widget de l'écran d'accueil\n• Rappels, catégories personnalisées, jour de début du mois et premier jour de la semaine\n\nCONFIDENTIALITÉ ET DONNÉES\n• Les transactions sont stockées sur votre appareil, pas sur nos serveurs\n• Aucun compte n'est requis\n• Verrouillage biométrique et floutage du solde d'un simple toucher\n• Sauvegarde sur Google Drive ou stockage local\n• Export CSV et import CSV\n• Les tickets et relevés que vous choisissez de scanner sont envoyés à un service d'IA tiers pour en lire le texte\n\nQUANTO PREMIUM\nTransactions récurrentes, comptes multiples, widgets, sauvegarde et export. Disponible en formule mensuelle, annuelle ou en achat unique à vie.\n\nQuanto fonctionne hors ligne, ne demande aucun compte et ne se connecte pas à votre banque. Un suivi des dépenses par IA, un planificateur de budget et un gestionnaire d'argent dans une seule app."},"flag":"🇫🇷","chip":"French"},{"code":"ES-ES","language":"Spanish (Spain)","appStoreLocale":"Spanish (Spain)","note":"High revenue per install","status":"data-backed","values":{"ios_name":"Quanto: Gastos, Budget Tracker","ios_sub":"Expense Manager, Money Planner","kw_us":"presupuesto,finanzas,dinero,ahorro,cuenta,ticket,factura,escanear,mensual,semanal,app,gratis","promo":"Escanea un ticket, importa un extracto bancario en PDF o dicta un gasto. Nuestra IA rellena los datos. Para más privacidad y seguridad, Quanto no se conecta a tu banco.","ios_desc":"Quanto es una aplicación de control de gastos con registro mediante IA. Escanea un ticket, importa un extracto bancario en PDF, dicta un gasto o escríbelo. Para máxima privacidad y seguridad, Quanto no se conecta a tu banco.\n\nCÓMO AÑADIR UN GASTO\n• Escanea un ticket. Nuestra IA lee el establecimiento y el importe, y asigna la mejor categoría automáticamente\n• Añade una captura de pantalla de tus movimientos del banco, de una pasarela de pago o de un justificante de transferencia. Nuestra IA la lee igual\n• Importa un extracto bancario en PDF. Nuestra IA extrae todas las operaciones de una sola vez\n• Dilo en voz alta. El registro por voz admite varios gastos en una misma frase y sigue funcionando después de salir de la aplicación\n• O añádelo tú mismo con un par de toques\n• ¿Has pagado en otra divisa? Añádelo tal cual y Quanto lo convierte por ti\n\nADÓNDE VA TU DINERO\n• Consulta tus movimientos por día, semana, mes, trimestre, año o cualquier intervalo de fechas\n• Gasto por categoría, con desglose dentro de cada categoría\n• Compara tus ingresos y tus gastos en Analíticas\n• Cuánto queda este mes, como importe y como porcentaje\n• Un calendario con el saldo neto de cada día\n• Filtra y ordena por cuenta, categoría, tipo, importe o fecha\n\nPRESUPUESTOS\n• Presupuestos semanales o mensuales\n• Varios presupuestos activos a la vez\n• Límites por categoría\n• Presupuesto restante del periodo actual\n\nSUSCRIPCIONES Y GASTOS RECURRENTES\nCada pago recurrente muestra su coste mensual y anual, la cuenta a la que se carga, su ciclo de facturación, la próxima fecha de renovación y todo lo pagado hasta la fecha.\n\nCUENTAS\nControla efectivo, tarjetas y cuentas por separado. Quanto muestra el patrimonio neto total de todas ellas.\n\nFORMAS DE ACCESO\n• Widget en la pantalla de inicio\n• Acciones en el centro de control\n• Atajos de Siri\n• Automatización con Apple Pay\n\nPRIVACIDAD Y DATOS\n• Las operaciones se guardan en tu dispositivo, no en nuestros servidores\n• No hace falta crear una cuenta\n• Bloqueo con Face ID y difuminado del saldo con un toque\n• Copia de seguridad en iCloud, Google Drive o almacenamiento local\n• Exportación e importación en CSV\n• Los tickets y extractos que decides escanear se envían a un servicio de IA de terceros para leer el texto\n\nPREMIUM\nOperaciones recurrentes, varias cuentas, widgets, acciones en el centro de control, automatización con Apple Pay, copia de seguridad y exportación. Disponible en modalidad mensual, anual o como compra única de por vida.\n\nQuanto funciona sin conexión, no requiere cuenta y no se conecta a tu banco.","iap_group":"Quanto Premium","iap_m":"Premium mensual: widgets","iap_y":"Premium anual: copias, CSV","iap_l":"Premium de por vida: cuentas","play_title":"Quanto: Gastos, Budget Tracker","play_short":"Control de gastos, presupuesto y tickets. Expense tracker & budget app.","play_full":"Quanto es una aplicación de control de gastos, presupuesto y gestión de dinero con registro mediante IA. Escanea un ticket, importa un extracto bancario en PDF, dicta un gasto o escríbelo. Para máxima privacidad y seguridad, Quanto no se conecta a tu banco.\n\nCÓMO AÑADIR UN GASTO\n• Escanea un ticket. Nuestra IA lee el establecimiento y el importe, y asigna la mejor categoría automáticamente\n• Añade una captura de pantalla de tus movimientos del banco, de una pasarela de pago o de un justificante de transferencia. Nuestra IA la lee igual\n• Importa un extracto bancario en PDF. Nuestra IA extrae todas las operaciones de una sola vez\n• Dilo en voz alta. El registro por voz admite varios gastos en una misma frase y sigue funcionando después de salir de la aplicación\n• O añádelo tú mismo con un par de toques\n• ¿Has pagado en otra divisa? Añádelo tal cual y Quanto lo convierte por ti, así que también sirve como aplicación de gastos de viaje\n\nCONTROL DE TUS GASTOS\n• Consulta tus movimientos por día, semana, mes, trimestre, año o cualquier intervalo de fechas\n• Gasto por categoría, con desglose dentro de cada categoría\n• Compara tus ingresos y tus gastos en Analíticas\n• Cuánto presupuesto queda este mes, como importe y como porcentaje\n• Un calendario con el saldo neto de cada día\n• Filtra y ordena por cuenta, categoría, tipo, importe o fecha\n\nPRESUPUESTOS Y LÍMITES\n• Presupuestos semanales o mensuales\n• Varios presupuestos activos a la vez\n• Límites de presupuesto por categoría\n• Presupuesto restante del periodo actual\n\nSUSCRIPCIONES Y GASTOS RECURRENTES\nCada pago recurrente muestra su coste mensual y anual, la cuenta a la que se carga, su ciclo de facturación, la próxima fecha de renovación y todo lo pagado hasta la fecha.\n\nCUENTAS Y PATRIMONIO NETO\nControla efectivo, tarjetas y cuentas por separado. Quanto muestra el patrimonio neto total A\n• Transaksi disimpan di perangkat Anda, bukan di server kami\n• Tidak perlu membuat akun\n• Kunci Face ID, dan pengaburan saldo sekali ketuk\n• Cadangan ke iCloud, Google Drive, atau penyimpanan lokal\n• Ekspor CSV dan impor CSV\n• Struk dan laporan yang Anda pilih untuk dipindai dikirim ke layanan AI pihak ketiga untuk membaca teksnya\n\nPREMIUM\nTransaksi berulang, banyak akun, widget, tindakan Pusat Kontrol, otomatisasi Apple Pay, cadangan, dan ekspor. Tersedia bulanan, tahunan, atau sebagai pembelian sekali bayar seumur hidup.\n\nQuanto bekerja offline, tidak memerlukan akun, dan tidak terhubung ke bank Anda.","iap_group":"Quanto Premium","iap_m":"Premium Bulanan: Widget","iap_y":"Premium Tahunan: Cadangan CSV","iap_l":"Premium Seumur Hidup: Akun","play_title":"Quanto: Budget Expense Tracker","play_short":"Catat pengeluaran, anggaran, struk. Expense tracker & money manager.","play_full":"Quanto adalah pencatat pengeluaran, perencana anggaran, dan pengatur keuangan dengan input AI. Pindai struk, impor laporan bank PDF, ucapkan pengeluaran, atau ketik sendiri. Demi privasi dan keamanan maksimal, Quanto tidak terhubung ke bank Anda Expense tracker, budget app, dan money manager dalam satu aplikasi.\n\nMENAMBAH PENGELUARAN\n• Pindai struk. AI kami membaca nama merchant dan jumlahnya, lalu menetapkan kategori terbaik secara otomatis\n• Tambahkan tangkapan layar transaksi dari bank, halaman pembayaran, atau bukti transfer. AI kami membacanya dengan cara yang sama\n• Impor laporan bank PDF. AI kami mengambil setiap transaksi dalam sekali proses\n• Ucapkan. Input suara menerima beberapa pengeluaran dalam satu kalimat, dan tetap bekerja setelah Anda keluar dari aplikasi\n• Atau tambahkan sendiri dalam beberapa ketukan\n• Membayar dengan mata uang lain? Masukkan apa adanya dan Quanto mengonversinya untuk Anda, sehingga Quanto juga menjadi pencatat pengeluaran perjalanan\n\nMELACAK PENGELUARAN ANDA\n• Tinjau transaksi per hari, minggu, bulan, kuartal, tahun, atau rentang tanggal khusus\n• Pengeluaran per kategori, dengan rincian pada setiap kategori\n• Bandingkan pemasukan dan pengeluaran di Analitik\n• Berapa sisa anggaran bulan ini, dalam jumlah dan dalam persentase\n• Kalender yang menampilkan posisi bersih setiap hari\n• Filter dan urutkan berdasarkan akun, kategori, jenis, jumlah, atau tanggal\n\nANGGARAN DAN BATAS ANGGARAN\n• Anggaran mingguan atau bulanan\n• Beberapa anggaran berjalan sekaligus\n• Batas anggaran per kategori\n• Sisa anggaran untuk periode berjalan\n\nLANGGANAN DAN PENGELUARAN BERULANG\nSetiap pembayaran berulang menampilkan biaya bulanan dan tahunannya, akun yang ditagih, siklus penagihannya, tanggal perpanjangan berikutnya, dan seluruh yang telah dibayarkan sampai saat ini.\n\nAKUN DAN KEKAYAAN BERSIH\nLacak uang tunai, kartu, dan akun secara terpisah. Quanto menampilkan total kekayaan bersih dari semuanya.\n\nWIDGET DAN PINTASAN\n• Tambahkan pengeluaran dari widget layar utama\n• Pengingat, kategori khusus, tanggal awal bulan, dan hari pertama dalam seminggu\n\nPRIVASI DAN DATA\n• Transaksi disimpan di perangkat Anda, bukan di server kami\n• Tidak perlu membuat akun\n• Kunci biometrik, dan pengaburan saldo sekali ketuk\n• Cadangan ke Google Drive atau penyimpanan lokal\n• Ekspor CSV dan impor CSV\n• Struk dan laporan yang Anda pilih untuk dipindai dikirim ke layanan AI pihak ketiga untuk membaca teksnya\n\nQUANTO PREMIUM\nTransaksi berulang, banyak akun, widget, cadangan, dan ekspor. Tersedia bulanan, tahunan, atau sebagai pembelian sekali bayar seumur hidup.\n\nQuanto bekerja offline, tidak memerlukan akun, dan tidak terhubung ke bank Anda. Sebuah expense tracker dan budget app berbasis AI: pencatat pengeluaran, perencana anggaran, dan pengatur keuangan dalam satu aplikasi."},"flag":"🇮🇩","chip":"Indonesian"},{"code":"MS","language":"Malay","appStoreLocale":"Malay","note":"","status":"data-backed","values":{"ios_name":"Quanto: Budget Expense Tracker","ios_sub":"Money Manager, Finance Planner","kw_us":"per rasingan. Quanto menunjukkan jumlah nilai bersih merentas kesemuanya.\n\nTITIK MASUK\n• Widget Skrin Utama\n• Tindakan Pusat Kawalan\n• Pintasan Siri\n• Automasi Apple Pay\n\nPRIVASI DAN DATA\n• Transaksi disimpan pada peranti anda, bukan pada pelayan kami\n• Tiada akaun diperlukan\n• Kunci Face ID, dan kaburan baki satu ketikan\n• Sandaran ke iCloud, Google Drive atau storan setempat\n• Eksport CSV dan import CSV\n• Resit dan penyata yang anda pilih untuk diimbas dihantar kepada perkhidmatan AI pihak ketiga untuk membaca teksnya\n\nPREMIUM\nTransaksi berulang, berbilang akaun, widget, tindakan Pusat Kawalan, automasi Apple Pay, sandaran dan eksport. Tersedia bulanan, tahunan, atau sebagai pembelian sekali seumur hidup.\n\nQuanto berfungsi di luar talian, tidak memerlukan akaun, dan tidak berhubung dengan bank anda.","iap_group":"Quanto Premium","iap_m":"Premium Bulanan: Widget","iap_y":"Premium Tahunan: Sandaran CSV","iap_l":"Premium Seumur Hidup: Akaun","play_title":"Quanto: Budget Expense Tracker","play_short":"Rekod perbelanjaan, bajet dan resit. Expense tracker & money manager.","play_full":"Quanto ialah penjejak perbelanjaan, perancang bajet dan pengurus kewangan dengan input AI. Imbas resit, import penyata bank PDF, sebut perbelanjaan anda, atau taip sendiri. Demi privasi dan keselamatan maksimum, Quanto tidak berhubung dengan bank anda.\n\nMENAMBAH PERBELANJAAN\n• Imbas resit. AI kami membaca nama peniaga dan jumlahnya, lalu menetapkan kategori terbaik secara automatik\n• Tambah tangkapan skrin transaksi anda daripada bank, halaman pembayaran atau resit pemindahan. AI kami membacanya dengan cara yang sama\n• Import penyata bank PDF. AI kami mengeluarkan setiap transaksi dalam satu pusingan\n• Sebut sahaja. Input suara menerima beberapa perbelanjaan dalam satu ayat, dan terus berfungsi selepas anda keluar daripada aplikasi\n• Atau tambah sendiri dengan beberapa ketikan\n• Membayar dalam mata wang lain? Masukkan seadanya dan Quanto menukarkannya untuk anda, yang turut menjadikan Quanto penjejak perbelanjaan perjalanan\n\nMENJEJAK PERBELANJAAN ANDA\n• Semak transaksi anda mengikut hari, minggu, bulan, suku tahun, tahun atau sebarang julat tarikh tersuai\n• Perbelanjaan mengikut kategori, dengan perincian bagi setiap kategori\n• Bandingkan pendapatan berbanding perbelanjaan dalam Analitik\n• Berapa banyak bajet yang tinggal bulan ini, sebagai jumlah dan sebagai peratusan\n• Kalendar yang menunjukkan kedudukan bersih setiap hari\n• Tapis dan isih mengikut akaun, kategori, jenis, jumlah atau tarikh\n\nBAJET DAN HAD BAJET\n• Bajet mingguan atau bulanan\n• Beberapa bajet berjalan serentak\n• Had bajet bagi setiap kategori\n• Baki bajet untuk tempoh semasa\n\nLANGGANAN DAN PERBELANJAAN BERULANG\nSetiap pembayaran berulang menunjukkan kos bulanan dan tahunannya, akaun yang dicaj, kitaran pengebilannya, tarikh pembaharuan seterusnya, dan semua yang telah dibayar setakat ini.\n\nAKAUN DAN NILAI BERSIH\nJejak tunai, kad dan akaun secara berasingan. Quanto menunjukkan jumlah nilai bersih merentas kesemuanya.\n\nWIDGET DAN PINTASAN\n• Tambah perbelanjaan daripada widget skrin utama\n• Peringatan, kategori tersuai, hari mula bulan dan hari pertama minggu\n\nPRIVASI DAN DATA\n• Transaksi disimpan pada peranti anda, bukan pada pelayan kami\n• Tiada akaun diperlukan\n• Kunci biometrik, dan kaburan baki satu ketikan\n• Sandaran ke Google Drive atau storan setempat\n• Eksport CSV dan import CSV\n• Resit dan penyata yang anda pilih untuk diimbas dihantar kepada perkhidmatan AI pihak ketiga untuk membaca teksnya\n\nQUANTO PREMIUM\nTransaksi berulang, berbilang akaun, widget, sandaran dan eksport. Tersedia bulanan, tahunan, atau sebagai pembelian sekali seumur hidup.\n\nQuanto berfungsi di luar talian, tidak memerlukan akaun, dan tidak berhubung dengan bank anda. Penjejak perbelanjaan AI, perancang bajet dan pengurus kewangan dalam satu aplikasi."},"flag":"🇲🇾","chip":"Malay"},{"code":"JA","language":"Japanese","appStoreLocale":"Japanese","note":"","status":"data-backed","values":{"ios_name":"Quanto 家計簿: Budget Tracker","ios_sub":"Expense Manager, Money Planner","kw_us":"予算,レシート,固定費,サブスク,収支,貯金,お金,家計,支出,節約,家計管理,かけいぼ,出費,通帳,自動,共有,旅行,現金,finance,app,無料","promo":"レシートを撮影する、PDFの銀行明細を取り込む、支出を声で話す。AIが詳細を入力します。プライバシーとセキュリティを最優先し、Quantoは銀行口座と接続しません。","ios_desc":"Quantoは、AI入力に対応した家計簿アプリです。レシートを撮影する、PDFの銀行明細を取り込む、声で話す、手で入力する。プライバシーとセキュリティを最優先し、Quantoは銀行口座と接続しません。\n\n支出を追加する\n• レシートを撮影します。AIが店名と金額を読み取り、最適なカテゴリを自動で割り当てます\n• 銀行の取引一覧、決済ページ、送金完了画面のスクリーンショットを追加します。AIが同じように読み取ります\n• PDFの銀行明細を取り込みます。AIが一度ですべての取引を抽出します\n• 声で入力します。音声入力は1つの文で複数の支出を受け付け、アプリを離れたあとも動作を続けます\n• 数タップで自分で入力することもできます\n• 外貨での支払いですか。そのまま追加すれば、Quantoが換算します\n\nお金の使い道\n• 日、週、月、四半期、年、または任意の期間で取引を確認できます\n• カテゴリ別の支出と、各カテゴリの内訳\n• 分析画面で収入と支出を比較できます\n• 今月の残りが、金額と割合でわかります\n• 毎日の収支を表示するカレンダー\n• 口座、カテゴリ、種類、金額、日付で絞り込みと並べ替えができます\n\n予算\n• 週単位または月単位の予算\n• 複数の予算を同時に使用\n• カテゴリごとの上限\n• 現在の期間の残り予算\n\nサブスクリプションと定期支出\n繰り返しの支払いごとに、月額と年額、引き落とす口座、請求サイクル、次回の更新日、これまでの支払い合計を表示します。\n\n口座\n現金、カード、口座を分けて管理します。Quantoはすべての合計となる純資産を表示します。\n\n入力の起点\n• ホーム画面のウィジェット\n• コントロールセンターの操作\n• Siriショートカット\n• Apple Payの自動化\n\nプライバシーとデータ\n• 取引はお使いのデバイスに保存され、当社のサーバーには保存されません\n• アカウントは必要ありません\n• Face IDによるロックと、ワンタップで残高を隠す機能\n• iCloud、Google Drive、ローカルストレージへのバックアップ\n• CSVの書き出しとCSVの読み込み\n• 読み取るために撮影したレシートや明細は、文字を読み取る第三者のAIサービスに送信されます\n\nプレミアム\n定期取引、複数の口座、ウィジェット、コントロールセンターの操作、Apple Payの自動化、バックアップと書き出し。月額、年額、または一度だけ支払う買い切りで利用できます。\n\nQuantoはオフラインで動作し、アカウントは必要なく、銀行とも接続しません。","iap_group":"Quanto プレミアム","iap_m":"プレミアム月額：ウィジェット","iap_y":"プレミアム年額：バックアップ・CSV","iap_l":"プレミアム買い切り：複数口座","play_title":"Quanto 家計簿: Budget Tracker","play_short":"家計簿・支出管理・予算・レシート読取。Expense tracker & budget planner.","play_full":"Quantoは、AI入力に対応した家計簿・予算管理・支出管理アプリです。レシートを撮影する、PDFの銀行明細を取り込む、声で話す、手で入力する。プライバシーとセキュリティを最優先し、Quantoは銀行口座と接続しません。\n\n支出を追加する\n• レシートを撮影します。AIが店名と金額を読み取り、最適なカテゴリを自動で割り当てます\n• 銀行の取引一覧、決済ページ、送金完了画面のスクリーンショットを追加します。AIが同じように読み取ります\n• PDFの銀行明細を取り込みます。AIが一度ですべての取引を抽出します\n• 声で入力します。音声入力は1つの文で複数の支出を受け付け、アプリを離れたあとも動作を続けます\n• 数タップで自分で入力することもできます\n• 外貨での支払いですか。そのまま追加すればQuantoが換算するので、旅行の家計簿としても使えます\n\n支出を記録する\n• 日、週、月、四半期、年、または任意の期間で取引を確認できます\n• カテゴリ別の支出と、各カテゴリの内訳\n• 分析画面で収入と支出を比較できます\n• 今月の残りの予算が、金額と割合でわかります\n• 毎日の収支を表示するカレンダー\n• 口座、カテゴリ、種類、金額、日付で絞り込みと並べ替えができます\n\n予算と予算の上限\n• 週単位または月単位の予算\n• 複数の予算を同時に使用\n• カテゴリごとの予算の上限\n• 現在の期間の残り予算\n\nサブスクリプションと定期支出\n繰り返しの支払いごとに、月額と年額、引き落とす口座、請求サイクル、次回の更新日、これまでの支払い合計を表示します。\n\n口座と純資産\n現金、カード、口座を分けて管理します。Quantoはすべての合計となる純資産を表示します。\n\nウィジェットとショートカット\n• ホーム画面のウィジェットから支出を追加できます\n• リマインダー、カスタムカテゴリ、月の開始日、週の開始曜日\n\nプライバシーとデータ\n• 取引はお使いのデバイスに保存され、当社のサーバーには保存されません\n• アカウントは必要ありません\n• 生体認証によるロックと、ワンタップで残高を隠す機能\n• Google Driveまたはローカルストレージへのバックアップ\n• CSVの書き出しとCSVの読み込み\n• 読み取るために撮影したレシートや明細は、文字を読み取る第三者のAIサービスに送信されます\n\nQuanto プレミアム\n定期取引、複数の口座、ウィジェット、バックアップと書き出し。月額、年額、または一度だけ支払う買い切りで利用できます。\n\nQuantoはオフラインで動作し、アカウントは必要なく、銀行とも接続しません。AI家計簿、予算管理、支出管理をひとつのアプリで。 Expense tracker・budget app・money manager：家計簿と支出管理をひとつのアプリで。"},"flag":"🇯🇵","chip":"Japanese"},{"code":"KO","language":"Korean","appStoreLocale":"Korean","note":"","status":"data-backed","values":{"ios_name":"Quanto 가계부: Budget Tracker","ios_sub":"Expense Manager, Money Planner","kw_us":"예산,지출관리,자산관리,생활비,고정지출,영수증,구독관리,돈관리,소비,수입,절약,통계,용돈,카드,현금,여행,자동,공유,finance,app,무료","promo":"영수증을 촬영하거나, PDF 거래내역서를 가져오거나, 지출을 말로 입력하세요. AI가 세부 내용을 채웁니다. 개인정보 보호와 보안을 위해 Quanto는 은행과 연결하지 않습니다.","ios_desc":"Quanto는 AI 입력을 지원하는 가계부 앱입니다. 영수증을 촬영하거나, PDF 거래내역서를 가져오거나, 말하거나, 직접 입력하세요. 개인정보 보호와 보안을 위해 Quanto는 은행과 연결하지 않습니다.\n\n지출 추가하기\n• 영수증을 촬영합니다. AI가 가맹점과 금액을 읽고 가장 알맞은 카테고리를 자동으로 지정합니다\n• 은행 거래 목록, 결제 페이지, 송금 확인 화면의 스크린샷을 추가합니다. AI가 같은 방식으로 읽습니다\n• PDF 거래내역서를 가져옵니다. AI가 한 번에 모든 거래를 추출합니다\n• 말로 입력합니다. 음성 입력은 한 문장에서 여러 건의 지출을 인식하며, 앱을 나간 뒤에도 계속 동작합니다\n• 몇 번의 탭으로 직접 입력할 수도 있습니다\n• 다른 통화로 결제했나요? 그대로 추가하면 Quanto가 환산합니다\n\n돈이 어디에 쓰이는지\n• 일, 주, 월, 분기, 연 또는 원하는 기간으로 거래를 확인합니다\n• 카테고리별 지출과 카테고리별 상세 내역\n• 분석에서 수입과 지출을 비교합니다\n• 이번 달 남은 금액을 금액과 비율로 보여줍니다\n• 하루하루의 수지를 보여주는 달력\n• 계좌, 카테고리, 유형, 금액, 날짜로 필터와 정렬\n\n예산\n• 주간 또는 월간 예산\n• 여러 예산을 동시에 사용\n• 카테고리별 한도\n• 현재 기간의 남은 예산\n\n구독과 정기 지출\n반복 결제마다 월 비용과 연 비용, 청구되는 계좌, 청구 주기, 다음 갱신일, 지금까지 결제한 총액을 보여줍니다.\n\n계좌\n현금, 카드, 계좌를 따로 관리합니다. Quanto는 전체를 합한 순자산을 보여줍니다.\n\n입력하는 방법\n• 홈 화면 위젯\n• 제어 센터 동작\n• Siri 단축어\n• Apple Pay 자동화\n\n개인정보와 데이터\n• 거래 내역은 저희 서버가 아니라 기기에 저장됩니다\n• 계정이 필요하지 않습니다\n• Face ID 잠금과 한 번의 탭으로 잔액 가리기\n• iCloud, Google Drive 또는 로컬 저장소에 백업\n• CSV 내보내기와 CSV 가져오기\n• 촬영한 영수증과 거래내역서는 텍스트를 읽기 위해 제3자 AI 서비스로 전송됩니다\n\n프리미엄\n정기 거래, 여러 계좌, 위젯, 제어 센터 동작, Apple Pay 자동화, 백업과 내보내기. 월간, 연간 또는 한 번만 결제하는 평생 이용으로 제공됩니다.\n\nQuanto는 오프라인에서 작동하고, 계정이 필요 없으며, 은행과 연결하지 않습니다.","iap_group":"Quanto 프리미엄","iap_m":"프리미엄 월간: 위젯","iap_y":"프리미엄 연간: 백업, CSV","iap_l":"프리미엄 평생: 여러 계좌","play_title":"Quanto 가계부: Budget Tracker","play_short":"가계부, 지출관리, 예산, 영수증 스캔. Expense tracker & budget planner.","play_full":"Quanto는 AI 입력을 지원하는 가계부, 예산 관리, 지출관리 앱입니다. 영수증을 촬영하거나, PDF 거래내역서를 가져오거나, 말하거나, 직접 입력하세요. 개인정보 보호와 보안을 위해 Quanto는 은행과 연결하지 않습니다.\n\n지출 추가하기\n• 영수증을 촬영합니다. AI가 가맹점과 금액을 읽고 가장 알맞은 카테고리를 자동으로 지정합니다\n• 은행 거래 목록, 결제 페이지, 송금 확인 화면의 스크린샷을 추가합니다. AI가 같은 방식으로 읽습니다\n• PDF 거래내역서를 가져옵니다. AI가 한 번에 모든 거래를 추출합니다\n• 말로 입력합니다. 음성 입력은 한 문장에서 여러 건의 지출을 인식하며, 앱을 나간 뒤에도 계속 동작합니다\n• 몇 번의 탭으로 직접 입력할 수도 있습니다\n• 다른 통화로 결제했나요? 그대로 추가하면 Quanto가 환산해 주므로 여행 가계부로도 쓸 수 있습니다\n\n지출 기록하기\n• 일, 주, 월, 분기, 연 또는 원하는 기간으로 거래를 확인합니다\n• 카테고리별 지출과 카테고리별 상세 내역\n• 분석에서 수입과 지출을 비교합니다\n• 이번 달 남은 예산을 금액과 비율로 보여줍니다\n• 하루하루의 수지를 보여주는 달력\n• 계좌, 카테고리, 유형, 금액, 날짜로 필터와 정렬\n\n예산과 예산 한도\n• 주간 또는 월간 예산\n• 여러 예산을 동시에 사용\n• 카테고리별 예산 한도\n• 현재 기간의 남은 예산\n\n구독과 정기 지출\n반복 결제마다 월 비용과 연 비용, 청구되는 계좌, 청구 주기, 다음 갱신일, 지금까지 결제한 총액을 보여줍니다.\n\n계좌와 순자산\n현금, 카드, 계좌를 따로 관리합니다. Quanto는 전체를 합한 순자산을 보여줍니다.\n\n위젯과 단축어\n• 홈 화면 위젯에서 지출을 추가합니다\n• 알림, 사용자 카테고리, 월 시작일과 주 시작 요일\n\n개인정보와 데이터\n• 거래 내역은 저희 서버가 아니라 기기에 저장됩니다\n• 계정이 필요하지 않습니다\n• 생체 인증 잠금과 한 번의 탭으로 잔액 가리기\n• Google Drive 또는 로컬 저장소에 백업\n• CSV 내보내기와 CSV 가져오기\n• 촬영한 영수증과 거래내역서는 텍스트를 읽기 위해 제3자 AI 서비스로 전송됩니다\n\nQuanto 프리미엄\n정기 거래, 여러 계좌, 위젯, 백업과 내보내기. 월간, 연간 또는 한 번만 결제하는 평생 이용으로 제공됩니다.\n\nQuanto는 오프라인에서 작동하고, 계정이 필요 없으며, 은행과 연결하지 않습니다. AI 가계부, 예산 관리, 지출관리를 앱 하나로."},"flag":"🇰🇷","chip":"Korean"},{"code":"NL","language":"Dutch","appStoreLocale":"Dutch","note":"","status":"data-backed","values":{"ios_name":"Quanto: Budget Expense Tracker","ios_sub":"Money Manager, Finance Planner","kw_us":"uitgaven,huishoudboekje,sparen,rekening,bon,abonnement,maandelijks,geld,kasboek,app,gratis","promo":"Scan een bon, importeer een PDF-bankafschrift of spreek een uitgave in. Onze AI vult de details in. Voor je privacy maakt Quanto geen verbinding met je bank.","ios_desc":"Quanto is een app om uitgaven bij te houden, met invoer door AI. Scan een bon, importeer een PDF-bankafschrift, spreek een uitgave in of typ hem. Voor maximale privacy en veiligheid maakt Quanto geen verbinding met je bank.\n\nEEN UITGAVE TOEVOEGEN\n• Scan een bon. Onze AI leest de winkel en het bedrag, en kiest automatisch de beste categorie\n• Voeg een schermafbeelding toe van je banktransacties, een betaalpagina of een overschrijvingsbewijs. Onze AI leest die op dezelfde manier\n• Importeer een PDF-bankafschrift. Onze AI haalt er in één keer elke transactie uit\n• Spreek hem in. Spraakinvoer verwerkt meerdere uitgaven in één zin en blijft werken nadat je de app hebt verlaten\n• Of voeg hem zelf toe met een paar tikken\n• In een andere valuta betaald? Voer het bedrag in zoals het is en Quanto rekent het voor je om\n\nWAAR JE GELD HEEN GAAT\n• Bekijk je transacties per dag, week, maand, kwartaal, jaar of een zelfgekozen periode\n• Uitgaven per categorie, met een uitsplitsing per categorie\n• Vergelijk je inkomsten en uitgaven in Analyses\n• Hoeveel er deze maand over is, als bedrag en als percentage\n• Een kalender met je nettosaldo per dag\n• Filter en sorteer op rekening, categorie, type, bedrag of datum\n\nBUDGETTEN\n• Budgetten per week of per maand\n• Meerdere budgetten tegelijk actief\n• Limieten per categorie\n• Resterend budget voor de huidige periode\n\nABONNEMENTEN EN TERUGKERENDE UITGAVEN\nElke terugkerende betaling toont de kosten per maand en per jaar, de rekening waarvan wordt afgeschreven, de facturatiecyclus, de volgende verlengdatum en het totaal dat je tot nu toe hebt betaald.\n\nREKENINGEN\nHoud contant geld, kaarten en rekeningen apart bij. Quanto toont het totale nettovermogen van alles samen.\n\nSNELLE INVOER\n• Widget op het beginscherm\n• Acties in het bedieningspaneel\n• Siri-opdrachten\n• Apple Pay-automatisering\n\nPRIVACY EN GEGEVENS\n• Transacties staan op je apparaat, niet op onze servers\n• Een account is niet nodig\n• Vergrendeling met Face ID en je saldo vervagen met één tik\n• Back-up naar iCloud, Google Drive of lokale opslag\n• CSV-export en CSV-import\n• Bonnen en afschriften die je zelf scant, worden naar een AI-dienst van derden gestuurd om de tekst te lezen\n\nPREMIUM\nTerugkerende transacties, meerdere rekeningen, widgets, acties in het bedieningspaneel, Apple Pay-automatisering, back-up en export. Per maand, per jaar of als eenmalige aankoop voor het leven.\n\nQuanto werkt offline, vraagt geen account en maakt geen verbinding met je bank.","iap_group":"Quanto Premium","iap_m":"Premium maand: widgets","iap_y":"Premium jaar: back-up, CSV","iap_l":"Premium eenmalig: rekeningen","play_title":"Quanto: Budget Expense Tracker","play_short":"Huishoudboekje, uitgaven en bonnen. Expense tracker & money manager.","play_full":"Quanto is een app om uitgaven bij te houden, een budgetplanner en een huishoudboekje met invoer door AI. Scan een bon, importeer een PDF-bankafschrift, spreek een uitgave in of typ hem. Voor maximale privacy en veiligheid maakt Quanto geen verbinding met je bank.\n\nEEN UITGAVE TOEVOEGEN\n• Scan een bon. Onze AI leest de winkel en het bedrag, en kiest automatisch de beste categorie\n• Voeg een schermafbeelding toe van je banktransacties, een betaalpagina of een overschrijvingsbewijs. Onze AI leest die op dezelfde manier\n• Importeer een PDF-bankafschrift. Onze AI haalt er in één keer elke transactie uit\n• Spreek hem in. Spraakinvoer verwerkt meerdere uitgaven in één zin en blijft werken nadat je de app hebt verlaten\n• Of voeg hem zelf toe met een paar tikken\n• In een andere valuta betaald? Voer het bedrag in zoals het is en Quanto rekent het voor je om, waarmee Quanto ook je uitgaven op reis bijhoudt\n\nJE UITGAVEN BIJHOUDEN\n• Bekijk je transacties per dag, week, maand, kwartaal, jaar of een zelfgekozen periode\n• Uitgaven per categorie, met een uitsplitsing per categorie\n• Vergelijk je inkomsten en uitgaven in Analyses\n• Hoeveel budget er deze maand over is, als bedrag en als percentage\n• Een kalender met je nettosaldo per dag\n• Filter en sorteer op rekening, categorie, type, bedrag of datum\n\nBUDGETTEN EN BUDGETLIMIETEN\n• Budgetten per week of per maand\n• Meerdere budgetten tegelijk actief\n• Budgetlimieten per categorie\n• Resterend budget voor de huidige periode\n\nABONNEMENTEN EN TERUGKERENDE UITGAVEN\nElke terugkerende betaling toont de kosten per maand en per jaar, de rekening waarvan wordt afgeschreven, de facturatiecyclus, de volgende verlengdatum en het totaal dat je tot nu toe hebt betaald.\n\nREKENINGEN EN NETTOVERMOGEN\nHoud contant geld, kaarten en rekeningen apart bij. Quanto toont het totale nettovermogen van alles samen.\n\nWIDGETS EN SNELKOPPELINGEN\n• Voeg uitgaven toe vanaf de widget op het beginscherm\n• Herinneringen, eigen categorieën, startdag van de maand en eerste dag van de week\n\nPRIVACY EN GEGEVENS\n• Transacties staan op je apparaat, niet op onze servers\n• Een account is niet nodig\n• Biometrische vergrendeling en je saldo vervagen met één tik\n• Back-up naar Google Drive of lokale opslag\n• CSV-export en CSV-import\n• Bonnen en afschriften die je zelf scant, worden naar een AI-dienst van derden gestuurd om de tekst te lezen\n\nQUANTO PREMIUM\nTerugkerende transacties, meerdere rekeningen, widgets, back-up en export. Per maand, per jaar of als eenmalige aankoop voor het leven.\n\nQuanto werkt offline, vraagt geen account en maakt geen verbinding met j const FIELDS = DATA.fields;
const LOCALES = DATA.locales;
const KEY = 'quanto-aso-progress-v1';

let current = LOCALES[0].code;
let store = 'ios';

/* ─── COPIED MARKERS ─── */
let progress = {};
try { progress = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { progress = {}; }
function saveProgress() { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} }
function isCopied(code, key) { return !!(progress[code] && progress[code][key]); }
function markCopied(code, key) {
  if (!progress[code]) progress[code] = {};
  progress[code][key] = true;
  saveProgress();
}

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fieldsFor = (loc, st) => FIELDS.filter(f => f.store === st && loc.values[f.key]);

function level(n, limit) { return n > limit ? 'over' : ''; }

function renderChips() {
  document.getElementById('chips').innerHTML = LOCALES.map(l =>
    '<button data-locale="' + l.code + '" class="' + (l.code === current ? 'active' : '') + '">' +
      '<span class="flag">' + l.flag + '</span><span>' + esc(l.chip) + '</span>' +
    '</button>').join('');
}

function fieldHTML(loc, f) {
  const val = loc.values[f.key];
  const n = val.length;
  const lv = level(n, f.limit);
  const pct = Math.min(100, (n / f.limit) * 100);
  const long = n > 400;
  const isKw = f.key.indexOf('kw_') === 0;
  return '' +
    '<div class="field' + (isCopied(loc.code, f.key) ? ' is-copied' : '') + '" data-key="' + f.key + '">' +
      '<div class="field-head">' +
        '<span class="field-label">' + esc(f.label) + '</span>' +
        '<span class="field-hint">' + esc(f.hint) + '</span>' +
        '<span class="meter ' + lv + '"><span style="width:' + pct + '%"></span></span>' +
        '<span class="count ' + lv + '">' + n + '/' + f.limit + '</span>' +
        '<button class="copy-btn" data-copy>Copy</button>' +
      '</div>' +
      '<div class="field-body' + (isKw ? ' kw' : '') + (long ? ' clamped' : '') + '">' + esc(val) + '</div>' +
      (long ? '<button class="expand" data-expand>Show full text</button>' : '') +
    '</div>';
}

const STATUS_BADGE = {
  'final':       { cls: 'final', label: 'Live',            desc: 'live in the App Store' },
  'data-backed': { cls: 'data',  label: 'Search Ads data', desc: '' },
  'draft':       { cls: 'draft', label: 'Draft copy',      desc: '' }
};

function statusBadge(loc) {
  const b = STATUS_BADGE[loc.status] || { cls: 'draft', label: loc.status, desc: '' };
  const desc = b.desc || DATA.status[loc.status] || '';
  return '<span class="status ' + b.cls + '"' +
         (desc ? ' title="' + esc(desc) + '"' : '') + '>' + esc(b.label) + '</span>';
}

function renderShots() {
  const el = document.getElementById('shots');
  const loc = LOCALES.find(l => l.code === current);
  const n = (DATA.shots[store] || {})[current] || 0;
  const [w, h] = DATA.shotDims[store];
  const label = store === 'ios' ? 'App Store' : 'Google Play';
  el.className = 'shots ' + store;
  let html = '';
  for (let i = 1; i <= n; i++) {
    const nn = String(i).padStart(2, '0');
    html += '<img src="shots/' + store + '/' + current + '/' + nn + '.jpg"' +
            ' width="' + w + '" height="' + h + '" loading="lazy" decoding="async"' +
            ' alt="' + esc(loc.language) + ' ' + label + ' screenshot ' + i + '">';
  }
  el.innerHTML = html;
  el.scrollLeft = 0;
}

function renderPanel() {
  const loc = LOCALES.find(l => l.code === current);
  const list = fieldsFor(loc, store);
  renderShots();

  document.getElementById('panel').innerHTML =
    '<div class="locale-head">' +
      '<h2>' + l_flag(loc) + esc(loc.language) + '</h2>' +
      statusBadge(loc) +
    '</div>' +
    list.map(f => fieldHTML(loc, f)).join('');
}

function l_flag(loc) { return '<span style="margin-right:10px">' + loc.flag + '</span>'; }

function renderAll() { renderChips(); renderPanel(); }

/* ─── TOAST ─── */
const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
    return ok;
  }
}

/* ─── EVENTS ─── */
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-locale]');
  if (!b) return;
  current = b.getAttribute('data-locale');
  renderAll();
});

document.getElementById('seg').addEventListener('click', e => {
  const b = e.target.closest('[data-store]');
  if (!b) return;
  store = b.getAttribute('data-store');
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  renderPanel();
});

document.getElementById('panel').addEventListener('click', async e => {
  const field = e.target.closest('.field');
  if (!field) return;
  const key = field.getAttribute('data-key');
  const loc = LOCALES.find(l => l.code === current);

  if (e.target.closest('[data-expand]')) {
    const body = field.querySelector('.field-body');
    const btn = e.target.closest('[data-expand]');
    btn.textContent = body.classList.toggle('clamped') ? 'Show full text' : 'Show less';
    return;
  }

  if (e.target.closest('[data-copy]')) {
    const ok = await copyText(loc.values[key]);
    if (!ok) { showToast('Press and hold to copy'); return; }
    showToast('Copied ' + FIELDS.find(f => f.key === key).label);
    markCopied(loc.code, key);
    field.classList.add('is-copied');
  }
});

document.getElementById('reset-all').addEventListener('click', () => {
  progress = {};
  saveProgress();
  renderPanel();
  showToast('Cleared copied markers');
});

document.getElementById('foot-note').textContent =
  DATA.app + ' store metadata — ' + LOCALES.length + ' locales, generated ' + DATA.generated +
  '. Copied markers are saved in this browser only.';
renderAll();
</script>
